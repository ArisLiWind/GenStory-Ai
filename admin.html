<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - GenSphere</title>
    <link rel="icon" type="image/png" href="assets/logo-icon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }
        .admin-layout { display: flex; min-height: 100vh; }
        .sidebar {
            width: 240px;
            background: rgba(255,255,255,0.03);
            border-right: 1px solid rgba(255,255,255,0.08);
            padding: 24px 0;
            flex-shrink: 0;
        }
        .sidebar-logo {
            padding: 0 24px 24px;
            font-size: 18px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 16px;
        }
        .sidebar-nav { list-style: none; }
        .sidebar-nav li {
            padding: 12px 24px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-nav li:hover { background: rgba(99, 102, 241, 0.1); }
        .sidebar-nav li.active {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            border-left: 3px solid #6366f1;
        }
        .main-content { flex: 1; padding: 32px; overflow-y: auto; }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .page-title { font-size: 24px; font-weight: 700; }
        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.25); }
        .btn-secondary {
            background: rgba(255,255,255,0.08);
            color: #fff;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.12); }

        /* Stats cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 24px;
        }
        .stat-label { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 8px; }
        .stat-value { font-size: 32px; font-weight: 700; }

        /* Table */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            overflow: hidden;
        }
        .data-table th {
            text-align: left;
            padding: 14px 16px;
            background: rgba(255,255,255,0.04);
            font-size: 13px;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .data-table td {
            padding: 14px 16px;
            font-size: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .data-table tr:hover { background: rgba(255,255,255,0.02); }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge-active { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
        .badge-inactive { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); }
        .badge-published { background: rgba(99, 102, 241, 0.15); color: #818cf8; }
        .badge-draft { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #161616;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 28px;
            width: 480px;
            max-width: 90vw;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-label { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 6px; display: block; }
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }
        .form-textarea { min-height: 80px; resize: vertical; font-family: inherit; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        /* Admin token prompt */
        .token-prompt {
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
        }
        .token-prompt h2 { margin-bottom: 16px; }
        .token-prompt p { color: rgba(255,255,255,0.5); margin-bottom: 24px; font-size: 14px; }

        .action-btns { display: flex; gap: 8px; }
        .action-btn {
            padding: 6px 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
        }
        .action-btn:hover { background: rgba(99, 102, 241, 0.25); }
        .action-btn.danger {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }
        .action-btn.danger:hover { background: rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body>
    <div id="tokenPrompt" class="token-prompt">
        <h2>🔐 管理后台</h2>
        <p>请输入管理员令牌以访问管理后台</p>
        <input type="password" id="adminTokenInput" class="form-input" placeholder="输入 Admin Token" style="margin-bottom: 16px;">
        <button class="btn btn-primary" onclick="loginAdmin()">进入管理后台</button>
    </div>

    <div id="adminApp" class="admin-layout" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-logo">⚡ GenSphere Admin</div>
            <ul class="sidebar-nav">
                <li class="active" data-page="dashboard" onclick="switchPage('dashboard')">📊 数据概览</li>
                <li data-page="api-keys" onclick="switchPage('api-keys')">🔑 API密钥</li>
                <li data-page="categories" onclick="switchPage('categories')">🏷️ 分类管理</li>
                <li data-page="characters" onclick="switchPage('characters')">🎭 角色管理</li>
                <li data-page="users" onclick="switchPage('users')">👥 用户管理</li>
            </ul>
        </aside>

        <main class="main-content">
            <!-- Dashboard -->
            <div id="page-dashboard" class="page">
                <div class="page-header">
                    <h1 class="page-title">数据概览</h1>
                </div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">用户总数</div>
                        <div class="stat-value" id="statUsers">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">角色总数</div>
                        <div class="stat-value" id="statCharacters">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">消息总数</div>
                        <div class="stat-value" id="statMessages">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">活跃API密钥</div>
                        <div class="stat-value" id="statKeys">0</div>
                    </div>
                </div>
            </div>

            <!-- API Keys -->
            <div id="page-api-keys" class="page" style="display: none;">
                <div class="page-header">
                    <h1 class="page-title">API密钥管理</h1>
                    <button class="btn btn-primary" onclick="openKeyModal()">+ 添加密钥</button>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>名称</th>
                            <th>服务商</th>
                            <th>模型</th>
                            <th>状态</th>
                            <th>优先级</th>
                            <th>调用次数</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="apiKeysTable"></tbody>
                </table>
            </div>

            <!-- Categories -->
            <div id="page-categories" class="page" style="display: none;">
                <div class="page-header">
                    <h1 class="page-title">分类管理</h1>
                    <button class="btn btn-primary" onclick="openCategoryModal()">+ 添加分类</button>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>图标</th>
                            <th>名称</th>
                            <th>标识</th>
                            <th>描述</th>
                            <th>排序</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="categoriesTable"></tbody>
                </table>
            </div>

            <!-- Characters -->
            <div id="page-characters" class="page" style="display: none;">
                <div class="page-header">
                    <h1 class="page-title">角色管理</h1>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>角色名</th>
                            <th>创作者</th>
                            <th>状态</th>
                            <th>浏览量</th>
                            <th>聊天数</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="charactersTable"></tbody>
                </table>
            </div>

            <!-- Users -->
            <div id="page-users" class="page" style="display: none;">
                <div class="page-header">
                    <h1 class="page-title">用户管理</h1>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>手机号</th>
                            <th>用户名</th>
                            <th>管理员</th>
                            <th>状态</th>
                            <th>注册时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="usersTable"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- API Key Modal -->
    <div id="keyModal" class="modal-overlay">
        <div class="modal">
            <h3 class="modal-title" id="keyModalTitle">添加API密钥</h3>
            <div class="form-group">
                <label class="form-label">名称</label>
                <input type="text" class="form-input" id="keyName" placeholder="如：OpenAI主账号">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">服务商</label>
                    <select class="form-select" id="keyProvider">
                        <option value="openai">OpenAI</option>
                        <option value="anthropic">Anthropic</option>
                        <option value="deepseek">DeepSeek</option>
                        <option value="zhipu">智谱AI</option>
                        <option value="moonshot">月之暗面</option>
                        <option value="other">其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">优先级</label>
                    <input type="number" class="form-input" id="keyPriority" value="0">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">API Key</label>
                <input type="password" class="form-input" id="keyApiKey" placeholder="sk-...">
            </div>
            <div class="form-group">
                <label class="form-label">Base URL</label>
                <input type="text" class="form-input" id="keyBaseUrl" placeholder="https://api.openai.com/v1">
            </div>
            <div class="form-group">
                <label class="form-label">模型</label>
                <input type="text" class="form-input" id="keyModel" placeholder="gpt-3.5-turbo">
            </div>
            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="keyActive" checked>
                    <span style="font-size: 14px;">启用</span>
                </label>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeKeyModal()">取消</button>
                <button class="btn btn-primary" onclick="saveKey()">保存</button>
            </div>
        </div>
    </div>

    <!-- Category Modal -->
    <div id="categoryModal" class="modal-overlay">
        <div class="modal">
            <h3 class="modal-title" id="categoryModalTitle">添加分类</h3>
            <div class="form-group">
                <label class="form-label">分类标识 (slug)</label>
                <input type="text" class="form-input" id="catSlug" placeholder="如：xianxia">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">名称</label>
                    <input type="text" class="form-input" id="catName" placeholder="如：修仙玄幻">
                </div>
                <div class="form-group">
                    <label class="form-label">图标 (emoji)</label>
                    <input type="text" class="form-input" id="catIcon" placeholder="⚔️">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">描述</label>
                <input type="text" class="form-input" id="catDesc" placeholder="分类描述">
            </div>
            <div class="form-group">
                <label class="form-label">排序</label>
                <input type="number" class="form-input" id="catSort" value="0">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeCategoryModal()">取消</button>
                <button class="btn btn-primary" onclick="saveCategory()">保存</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let adminToken = localStorage.getItem('admin_token') || '';
        let editingKeyId = null;
        let editingCatId = null;

        function loginAdmin() {
            const token = document.getElementById('adminTokenInput').value.trim();
            if (!token) return;
            adminToken = token;
            localStorage.setItem('admin_token', token);
            checkAccess();
        }

        async function checkAccess() {
            try {
                const res = await fetch(`${API_BASE}/admin/stats`, {
                    headers: { 'X-Admin-Token': adminToken }
                });
                if (res.ok) {
                    document.getElementById('tokenPrompt').style.display = 'none';
                    document.getElementById('adminApp').style.display = 'flex';
                    loadStats();
                } else {
                    alert('令牌无效');
                    adminToken = '';
                    localStorage.removeItem('admin_token');
                }
            } catch (e) {
                alert('连接失败，请确保后端API已部署');
            }
        }

        function switchPage(page) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById('page-' + page).style.display = 'block';
            document.querySelectorAll('.sidebar-nav li').forEach(li => li.classList.remove('active'));
            document.querySelector(`[data-page="${page}"]`).classList.add('active');

            if (page === 'api-keys') loadApiKeys();
            if (page === 'categories') loadCategories();
            if (page === 'characters') loadCharacters();
            if (page === 'users') loadUsers();
            if (page === 'dashboard') loadStats();
        }

        async function loadStats() {
            const res = await fetch(`${API_BASE}/admin/stats`, {
                headers: { 'X-Admin-Token': adminToken }
            });
            const data = await res.json();
            if (data.code === 0) {
                document.getElementById('statUsers').textContent = data.data.userCount;
                document.getElementById('statCharacters').textContent = data.data.characterCount;
                document.getElementById('statMessages').textContent = data.data.messageCount;
                document.getElementById('statKeys').textContent = data.data.activeApiKeys;
            }
        }

        async function loadApiKeys() {
            const res = await fetch(`${API_BASE}/admin/api-keys`, {
                headers: { 'X-Admin-Token': adminToken }
            });
            const data = await res.json();
            const tbody = document.getElementById('apiKeysTable');
            tbody.innerHTML = data.data.items.map(k => `
                <tr>
                    <td>${k.name}</td>
                    <td>${k.provider}</td>
                    <td>${k.model || '-'}</td>
                    <td><span class="badge ${k.is_active ? 'badge-active' : 'badge-inactive'}">${k.is_active ? '启用' : '停用'}</span></td>
                    <td>${k.priority}</td>
                    <td>${k.usage_count || 0}</td>
                    <td class="action-btns">
                        <button class="action-btn" onclick="editKey(${k.id})">编辑</button>
                        <button class="action-btn danger" onclick="deleteKey(${k.id})">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        function openKeyModal() {
            editingKeyId = null;
            document.getElementById('keyModalTitle').textContent = '添加API密钥';
            document.getElementById('keyName').value = '';
            document.getElementById('keyProvider').value = 'openai';
            document.getElementById('keyApiKey').value = '';
            document.getElementById('keyBaseUrl').value = '';
            document.getElementById('keyModel').value = '';
            document.getElementById('keyPriority').value = '0';
            document.getElementById('keyActive').checked = true;
            document.getElementById('keyModal').classList.add('active');
        }

        function editKey(id) {
            alert('编辑功能请直接在数据库或重新添加');
        }

        async function saveKey() {
            const body = {
                name: document.getElementById('keyName').value,
                provider: document.getElementById('keyProvider').value,
                apiKey: document.getElementById('keyApiKey').value,
                baseUrl: document.getElementById('keyBaseUrl').value,
                model: document.getElementById('keyModel').value,
                priority: parseInt(document.getElementById('keyPriority').value),
                isActive: document.getElementById('keyActive').checked
            };

            const res = await fetch(`${API_BASE}/admin/api-keys`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Admin-Token': adminToken
                },
                body: JSON.stringify(body)
            });

            if (res.ok) {
                closeKeyModal();
                loadApiKeys();
            } else {
                alert('保存失败');
            }
        }

        function closeKeyModal() {
            document.getElementById('keyModal').classList.remove('active');
        }

        async function deleteKey(id) {
            if (!confirm('确定删除此API密钥？')) return;
            await fetch(`${API_BASE}/admin/api-keys/${id}`, {
                method: 'DELETE',
                headers: { 'X-Admin-Token': adminToken }
            });
            loadApiKeys();
        }

        async function loadCategories() {
            const res = await fetch(`${API_BASE}/categories`);
            const data = await res.json();
            const tbody = document.getElementById('categoriesTable');
            tbody.innerHTML = data.data.map(c => `
                <tr>
                    <td style="font-size: 20px;">${c.icon || '-'}</td>
                    <td>${c.name}</td>
                    <td><code style="color: #818cf8;">${c.slug}</code></td>
                    <td style="color: rgba(255,255,255,0.5);">${c.description || '-'}</td>
                    <td>${c.sort_order}</td>
                    <td><span class="badge badge-active">启用</span></td>
                    <td class="action-btns">
                        <button class="action-btn" onclick="deleteCategory(${c.id})">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        function openCategoryModal() {
            editingCatId = null;
            document.getElementById('categoryModalTitle').textContent = '添加分类';
            document.getElementById('catSlug').value = '';
            document.getElementById('catName').value = '';
            document.getElementById('catIcon').value = '';
            document.getElementById('catDesc').value = '';
            document.getElementById('catSort').value = '0';
            document.getElementById('categoryModal').classList.add('active');
        }

        async function saveCategory() {
            const body = {
                slug: document.getElementById('catSlug').value,
                name: document.getElementById('catName').value,
                icon: document.getElementById('catIcon').value,
                description: document.getElementById('catDesc').value,
                sortOrder: parseInt(document.getElementById('catSort').value)
            };

            const res = await fetch(`${API_BASE}/admin/categories`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Admin-Token': adminToken
                },
                body: JSON.stringify(body)
            });

            if (res.ok) {
                closeCategoryModal();
                loadCategories();
            } else {
                alert('保存失败');
            }
        }

        function closeCategoryModal() {
            document.getElementById('categoryModal').classList.remove('active');
        }

        async function deleteCategory(id) {
            if (!confirm('确定删除此分类？')) return;
            await fetch(`${API_BASE}/admin/categories/${id}`, {
                method: 'DELETE',
                headers: { 'X-Admin-Token': adminToken }
            });
            loadCategories();
        }

        async function loadCharacters() {
            const res = await fetch(`${API_BASE}/admin/characters?pageSize=50`, {
                headers: { 'X-Admin-Token': adminToken }
            });
            const data = await res.json();
            const tbody = document.getElementById('charactersTable');
            tbody.innerHTML = data.data.items.map(c => `
                <tr>
                    <td>${c.id}</td>
                    <td>${c.title}</td>
                    <td>${c.creator_name}</td>
                    <td><span class="badge ${c.status === 'published' ? 'badge-published' : 'badge-draft'}">${c.status === 'published' ? '已发布' : '草稿'}</span></td>
                    <td>${c.view_count}</td>
                    <td>${c.chat_count}</td>
                    <td class="action-btns">
                        <button class="action-btn" onclick="toggleCharStatus(${c.id}, '${c.status}')">${c.status === 'published' ? '下架' : '发布'}</button>
                    </td>
                </tr>
            `).join('');
        }

        async function toggleCharStatus(id, currentStatus) {
            const newStatus = currentStatus === 'published' ? 'draft' : 'published';
            await fetch(`${API_BASE}/admin/characters/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Admin-Token': adminToken
                },
                body: JSON.stringify({ status: newStatus })
            });
            loadCharacters();
        }

        async function loadUsers() {
            const res = await fetch(`${API_BASE}/admin/users`, {
                headers: { 'X-Admin-Token': adminToken }
            });
            const data = await res.json();
            const tbody = document.getElementById('usersTable');
            tbody.innerHTML = data.data.items.map(u => `
                <tr>
                    <td style="font-size: 12px; color: rgba(255,255,255,0.5);">${u.id}</td>
                    <td>${u.phone}</td>
                    <td>${u.username || '-'}</td>
                    <td>${u.is_admin ? '是' : '否'}</td>
                    <td><span class="badge ${u.status === 'active' ? 'badge-active' : 'badge-inactive'}">${u.status === 'active' ? '正常' : '禁用'}</span></td>
                    <td>${new Date(u.created_at).toLocaleDateString()}</td>
                    <td class="action-btns">
                        <button class="action-btn" onclick="toggleAdmin('${u.id}', ${u.is_admin})">${u.is_admin ? '取消管理员' : '设为管理员'}</button>
                    </td>
                </tr>
            `).join('');
        }

        async function toggleAdmin(userId, isAdmin) {
            await fetch(`${API_BASE}/admin/users/${userId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Admin-Token': adminToken
                },
                body: JSON.stringify({ isAdmin: !isAdmin })
            });
            loadUsers();
        }

        // Auto check on load
        if (adminToken) checkAccess();
    </script>
</body>
</html>
