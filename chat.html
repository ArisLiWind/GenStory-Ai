<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天 - GenSphere</title>
    <link rel="icon" type="image/png" href="assets/logo-icon.png">
    <link rel="stylesheet" href="css/style.css?v=20240910f">
    <link rel="stylesheet" href="css/chat.css?v=20240910f">
</head>
<body class="chat-page-body">
    <div class="chat-layout">
        <!-- Header -->
        <header class="chat-header">
            <div class="chat-header-left">
                <button class="chat-back-btn" onclick="goBack()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                    <span>返回</span>
                </button>
            </div>
            <div class="chat-header-center">
                <button class="chat-char-title-btn" onclick="toggleCharacterInfo()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                    <span id="headerCharName">角色名称</span>
                </button>
            </div>
            <div class="chat-header-right">
                <!-- Character info panel will be shown here when expanded -->
            </div>
        </header>

        <!-- Character Info Panel (accordion style) -->
        <div class="char-info-panel" id="charInfoPanel" style="display:none;">
            <div class="char-info-content">
                <div class="char-info-avatar">
                    <img src="" alt="" id="panelAvatar">
                </div>
                <div class="char-info-text">
                    <div class="char-info-name" id="panelCharName"></div>
                    <div class="char-info-desc" id="panelCharDesc"></div>
                </div>
            </div>
        </div>

        <!-- RPG World State Bar -->
        <div class="rpg-world-state-bar" id="worldStateBar" style="display: none;">
            <div class="rpg-world-state-content">
                <span class="rpg-state-item">
                    <svg class="rpg-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <span id="worldStateTime">未知时间</span>
                </span>
                <span class="rpg-state-divider">·</span>
                <span class="rpg-state-item">
                    <svg class="rpg-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                    <span id="worldStateLocation">未知地点</span>
                </span>
                <span class="rpg-state-divider">·</span>
                <span class="rpg-state-item">
                    <svg class="rpg-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17.5 19a4.5 4.5 0 1 0-1.1-8.86 6 6 0 0 0-11.5 1.36A4 4 0 0 0 6 19h11.5z"/>
                        <line x1="10" y1="14" x2="10" y2="18"/>
                        <line x1="14" y1="14" x2="14" y2="18"/>
                        <line x1="12" y1="12" x2="12" y2="16"/>
                    </svg>
                    <span id="worldStateWeather">未知天气</span>
                </span>
            </div>
        </div>

        <!-- Messages Area -->
        <main class="messages-area">
            <div class="messages-container">
                <!-- Messages will be rendered here -->
                <div id="messagesList"></div>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="chat-input-area">
            <div class="chat-input-container">
                <!-- Action Options -->
                <div class="rpg-action-options" id="actionOptions" style="display: none;">
                    <div class="rpg-action-label">选择你的行动：</div>
                    <div class="rpg-action-buttons" id="actionButtons">
                        <!-- Action buttons will be rendered here -->
                    </div>
                </div>

                <div class="chat-input-wrapper">
                    <div class="input-controls-left">
                        <button class="sparkle-btn" title="灵感模式">
                            <svg viewBox="0 0 256 256" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                <defs>
                                    <radialGradient id="sparkleGrad" cx="78%" cy="55%" r="78%" fx="78%" fy="55%">
                                        <stop offset="0%" stop-color="#8b5cf6"/>
                                        <stop offset="50%" stop-color="#6366f1"/>
                                        <stop offset="100%" stop-color="#06b6d4"/>
                                    </radialGradient>
                                </defs>
                                <path d="M156 208a8 8 0 0 1-8 8h-8v12a8 8 0 0 1-16 0v-12h-8a8 8 0 0 1 0-16h24a8 8 0 0 1 8 8Zm-8-148h8a8 8 0 0 0 0-16h-8V32a8 8 0 0 0-16 0v12h-8a8 8 0 0 0 0 16h24v12a8 8 0 0 0 16 0V60ZM40 136h12v8a8 8 0 0 0 16 0v-8h12a8 8 0 0 0 0-16H52v-8a8 8 0 0 0-16 0v12H24a8 8 0 0 0 0 16h16v12a8 8 0 0 0 16 0v-12Zm176-8h-12v-8a8 8 0 0 0-16 0v8h-12a8 8 0 0 0 0 16h12v8a8 8 0 0 0 16 0v-8h12a8 8 0 0 0 0-16Zm-62.34 54.77a8 8 0 0 0-11.32 11.32l12 12a8 8 0 0 0 11.32-11.32ZM152.49 68.43l-12-12a8 8 0 0 0-11.31 11.31l12 12a8 8 0 0 0 11.31-11.31ZM65.49 178.34l-12 12a8 8 0 0 0 11.32 11.32l12-12a8 8 0 0 0-11.32-11.32ZM76.79 79.69l-12-12a8 8 0 0 0-11.31 11.31l12 12a8 8 0 0 0 11.31-11.31Z"/>
                            </svg>
                        </button>
                    </div>
                    <textarea 
                        class="chat-textarea" 
                        id="chatInput" 
                        placeholder="自由行动：输入你想做的事..."
                        rows="1"
                    ></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 448 512" xmlns="http://www.w3.org/2000/svg">
                            <path d="M34.9 289.5l-22.2-22.2c-9.4-9.4-9.4-24.6 0-33.9L207 39c9.4-9.4 24.6-9.4 33.9 0l194.3 194.3c9.4 9.4 9.4 24.6 0 33.9L413 289.4c-9.5 9.5-25 9.3-34.3-.4L264 168.6V456c0 13.3-10.7 24-24 24h-32c-13.3 0-24-10.7-24-24V168.6L69.2 289.1c-9.3 9.7-24.8 9.9-34.3.4z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <script src="js/api.js?v=20240910f"></script>
    <script src="js/chat.js?v=20240910f"></script>
</body>
</html>
