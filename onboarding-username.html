<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置用户名 - GenSphere</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="icon" type="image/png" href="assets/logo.png">
</head>
<body class="auth-body">
    <!-- 背景装饰 -->
    <div class="bg-decoration">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <!-- Header -->
            <div class="onboarding-header">
                <div class="onboarding-step">
                    步骤 <strong>1</strong> / 2
                </div>
                <button class="onboarding-skip" onclick="skipOnboarding()">跳过</button>
            </div>

            <!-- Welcome -->
            <h1 class="onboarding-title">给自己起个名字吧</h1>
            <p class="onboarding-subtitle">
                一个好记的名字，让其他用户更容易认识你
            </p>

            <!-- Form -->
            <form id="usernameForm">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" class="form-input" id="usernameInput" 
                           placeholder="请输入用户名" maxlength="20">
                    <p class="form-hint" id="usernameHint">2-20个字符，支持中英文、数字和下划线</p>
                </div>

                <div class="username-suggestions" id="suggestions">
                    <span class="username-suggestion" data-name="星空漫步者">星空漫步者</span>
                    <span class="username-suggestion" data-name="梦境旅人">梦境旅人</span>
                    <span class="username-suggestion" data-name="故事收藏家">故事收藏家</span>
                    <span class="username-suggestion" data-name="时光雕刻师">时光雕刻师</span>
                    <span class="username-suggestion" data-name="异世界探索者">异世界探索者</span>
                </div>

                <div class="onboarding-footer" style="margin-top: 32px;">
                    <button type="button" class="btn-back" onclick="goBack()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                    </button>
                    <button type="submit" class="btn-next" id="nextBtn" disabled>
                        下一步
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/onboarding-username.js"></script>
</body>
</html>
