<body class="auth-body">
    <!-- 背景装饰 -->
    <div class="bg-decoration">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-logo">
                <img src="assets/logo.png" alt="GenSphere Logo" class="auth-logo-icon">
                <span class="auth-logo-text">GenSphere</span>
            </div>

            <h1 class="auth-title">欢迎回来</h1>
            <p class="auth-subtitle">输入手机号，开启你的 AI 角色扮演之旅</p>

            <!-- 手机号登录表单 -->
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label">手机号</label>
                    <div class="phone-input-wrapper">
                        <select class="phone-prefix" id="phonePrefix">
                            <option value="+86">+86</option>
                            <option value="+852">+852</option>
                            <option value="+853">+853</option>
                            <option value="+886">+886</option>
                            <option value="+1">+1</option>
                            <option value="+44">+44</option>
                            <option value="+81">+81</option>
                        </select>
                        <input type="tel" class="form-input phone-input" id="phoneInput" 
                               placeholder="请输入手机号" maxlength="11">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">验证码</label>
                    <div class="code-input-wrapper">
                        <input type="text" class="form-input code-input" id="codeInput" 
                               placeholder="请输入验证码" maxlength="6">
                        <button type="button" class="btn-send-code" id="sendCodeBtn">获取验证码</button>
                    </div>
                    <p class="form-hint" id="formHint">未注册的手机号将自动创建账号</p>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span class="btn-text">登录</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>

                <div class="auth-agreement">
                    <label class="checkbox-label">
                        <input type="checkbox" id="agreeCheck" checked>
                        <span class="checkbox-custom"></span>
                        <span class="agreement-text">
                            我已阅读并同意
                            <a href="#">《用户协议》</a>
                            和
                            <a href="#">《隐私政策》</a>
                        </span>
                    </label>
                </div>
            </form>

            <div class="auth-divider">
                <span>其他登录方式</span>
            </div>
