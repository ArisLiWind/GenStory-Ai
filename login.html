<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - GenSphere</title>
    <link rel="stylesheet" href="css/auth.css?v=20240910b">
    <link rel="icon" type="image/png" href="assets/logo-icon.png">
</head>
<body class="auth-body">
    <!-- 背景装饰 -->
    <div class="auth-bg">
        <div class="auth-bg-gradient"></div>
        <div class="auth-bg-glow glow-top"></div>
    </div>

    <div class="auth-page">
        <div class="auth-container">
            <!-- 顶部 Logo + 标题 -->
            <div class="auth-header">
                <div class="auth-logo">
                    <img src="assets/logo-icon.png" alt="GenSphere" class="auth-logo-icon">
                    <img src="assets/logo-text-light.png" alt="GenSphere" class="auth-logo-text-img">
                </div>
                <h1 class="auth-title">欢迎回来</h1>
            </div>

            <!-- 登录表单 -->
            <form class="auth-form" id="loginForm">
                <!-- 手机号 -->
                <div class="form-group">
                    <label class="form-label">手机号</label>
                    <div class="phone-input-group">
                        <div class="phone-prefix">
                            <span>+86</span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M6 9l6 6 6-6"/>
                            </svg>
                        </div>
                        <input type="tel" class="form-input phone-input" id="phoneInput" 
                               placeholder="请输入手机号" maxlength="11">
                    </div>
                </div>

                <!-- 验证码 -->
                <div class="form-group">
                    <label class="form-label">验证码</label>
                    <div class="code-input-group">
                        <input type="text" class="form-input code-input" id="codeInput" 
                               placeholder="请输入验证码" maxlength="6">
                        <button type="button" class="btn-send-code" id="sendCodeBtn">获取验证码</button>
                    </div>
                </div>

                <!-- 提示 -->
                <div class="form-hint" id="formHint">未注册的手机号将自动创建账号</div>

                <!-- 登录按钮 -->
                <button type="submit" class="btn-submit" id="submitBtn">
                    <span class="btn-text">登录</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>

                <!-- 选项区域 -->
                <div class="auth-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="autoLoginCheck" checked>
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">自动登录</span>
                    </label>
                    <label class="checkbox-label agreement-label">
                        <input type="checkbox" id="agreeCheck" checked>
                        <span class="checkbox-custom"></span>
                        <span class="agreement-text">
                            我已阅读并同意
                            <a href="#" class="link-text">《用户协议》</a>
                            和
                            <a href="#" class="link-text">《隐私政策》</a>
                        </span>
                    </label>
                </div>
            </form>

            <!-- 其他登录方式 -->
            <div class="auth-social-section">
                <div class="divider">
                    <span>or</span>
                </div>
                <div class="auth-social">
                    <button class="social-btn" title="微信登录">
                        <svg viewBox="0 0 24 24" fill="currentColor">

                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js?v=20240910b"></script>
    <script src="js/login.js?v=20240910b"></script>
</body>
</html>
